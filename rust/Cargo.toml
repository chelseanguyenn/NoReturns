[package]
name = "sessions"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
bytes = "1.12.2"
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = "0.1.52"
parquet = { version = "60.1.0", default-features = false }
rayon = "1.12.0"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.profiling]
inherits = "release"
debug = true
